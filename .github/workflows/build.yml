name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test audio processing, media keys and localization
        run: bash test.sh
      - name: Build signed application
        run: bash build.sh
      - name: Check website JavaScript
        run: node --check docs/app.js
