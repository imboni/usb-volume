<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>USB Volume</title><link rel="stylesheet" href="popup.css"></head>
<body class="entering" data-input="pointer">
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="icon-speaker" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
  <symbol id="icon-muted" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4Zm5 5 6 6m0-6-6 6"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  <symbol id="icon-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4v.01"/></symbol>
  <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></symbol>
  <symbol id="icon-stop" viewBox="0 0 24 24"><path d="M12 3v9m-5-7a8 8 0 1 0 10 0"/></symbol>
  <symbol id="icon-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.4 2.3c-.7.3-.9.8-.9 1.7m0 3v.01"/></symbol>
</defs></svg>
<header><h1 id="subtitle"></h1><details id="help"><summary id="help-label" class="icon-button"><svg class="icon" aria-hidden="true"><use href="#icon-help"/></svg></summary><div class="help-content"><p id="privacy-label"></p><p id="hint"></p></div></details></header>
<main>
  <section id="current" aria-label="Current page"><p id="current-title" dir="auto"></p><button id="enable" class="primary" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg><span id="enable-label"></span></button></section>
  <div id="error" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="#icon-alert"/></svg><p id="error-text"></p><button id="dismiss-error" class="icon-button" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button></div>
  <section id="mixer" aria-label="Page volume"><div id="tabs"></div></section>
</main>
<template id="row-template"><article class="tab-row"><div class="row-title"><strong class="title" dir="auto"></strong><output dir="auto"></output></div><div class="volume-control"><button class="mute icon-button" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-speaker"/></svg></button><input type="range" dir="ltr" min="0" max="100" step="1"><button class="reset icon-button secondary" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-reset"/></svg></button><button class="stop icon-button secondary" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-stop"/></svg></button></div></article></template>
<script type="module" src="popup.js"></script>
</body></html>
